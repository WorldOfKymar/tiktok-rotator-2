[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/rotate"
  status = 200
  force = true

[[redirects]]
  from = "/go"
  to = "/.netlify/functions/rotate"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

# Existing dashboard bookmark still works and opens the new manager.
